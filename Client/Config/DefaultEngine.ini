[SystemSettings]
; Mesa RADV 26.2 (ACO) aborts compiling one of UE 5.8's global compute shaders during
; startup PSO precaching ("Unimplemented intrinsic instr: @store_deref"). That shader is
; never used by this game's rendering, so skip precaching global shaders. Material PSO
; precaching stays on. Revisit once Mesa is fixed.
r.PSOPrecache.GlobalShaders=0
; Imported UT2004 BSP/terrain chunks are large non-Nanite meshes, which overflow the virtual shadow map
; marking queue (a fixed-size shader buffer) and show a developer warning on screen. Shadows still render;
; hide the message. The proper fix is enabling Nanite on the imported static meshes.
r.Shadow.Virtual.AllowScreenOverflowMessages=0

[Linux.SDL]
; Native Wayland on Linux; X11 only when no Wayland compositor is available. Override per run with
; -sdlvideodriver=x11 or the SDL_VIDEO_DRIVER environment variable.
VideoDriver=wayland,x11

; Wide and ultrawide screens (ArenaDisplay): keep the vertical FOV and widen the horizontal one (Hor+). Camera FOVs
; are horizontal at the camera's AspectRatio; the game converts its UT2004-style 4:3 FOV setting per viewport.
; No letterboxing: cameras never constrain the aspect ratio (bConstrainAspectRatio stays false).
[/Script/Engine.LocalPlayer]
AspectRatioAxisConstraint=AspectRatio_MaintainYFOV
