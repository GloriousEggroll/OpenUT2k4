; Developer-only package that includes the local UT2004 editor imports (Content/Imported, Content/ImportedData).
; Used by Scripts/build-*.sh --with-imports. Such a package contains UT2004 data: never distribute it.
[/Script/UnrealEd.ProjectPackagingSettings]
-DirectoriesToNeverCook=(Path="/Game/Imported")
+DirectoriesToAlwaysCook=(Path="/Game/Imported")
+DirectoriesToAlwaysStageAsNonUFS=(Path="ImportedData")
