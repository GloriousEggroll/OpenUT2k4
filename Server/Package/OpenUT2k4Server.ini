; OpenUT2k4 dedicated server: default configuration.
;
; Copy this file, edit the copy and start the server with -ServerConfig=<copy> (or UCC style: ini=<copy>). This file
; is read first; the server ini, a -ServerProfile=<dir> (its UT2004.ini and Server.ini) and the command line override it.
; Section and key names follow UT2004's server ini, so the matching sections of a UT2004.ini work as well.
; The values below are the stock UT2004 dedicated server's defaults, except that the master server uplink is off.
; Server/Docs/DedicatedServer.md describes every key.

[OpenUT2k4.Server]
; Stock game types: XGame.xDeathMatch XGame.xTeamGame XGame.xCTFGame XGame.xBombingRun XGame.xDoubleDom
; BonusPack.xLastManStandingGame BonusPack.xMutantGame Onslaught.ONSOnslaughtGame UT2k4Assault.ASGameInfo SkaarjPack.Invasion
GameType=XGame.xDeathMatch
; First map (empty: the first of the rotation)
Map=
; Map rotation, one Maps= line per map. None given: the UT2004 install's own stock map list for the game type
; ([XInterface.MapListDeathMatch] ... in its System/UT2004.ini or Default.ini). Maps missing from the content cache are skipped.
;Maps=DM-Rankin
;Maps=DM-Antalus
; Mutators, comma separated (UT2004 ?Mutator= syntax), e.g. XGame.MutInstaGib
Mutators=
; Bots fill the match up to MinPlayers while players are connected (UT2004 MinPlayers); BotsWhenEmpty keeps them
; playing on an empty server.
MinPlayers=0
BotsWhenEmpty=False
; Bot skill 0 (Novice) .. 7 (Godlike)
BotSkill=3
; Extra URL options for the game, e.g. ?Translocator=1
ExtraOptions=
LANServer=False
; ServerPackages= lines of [Engine.GameEngine] replace the install's list (see there)
UseServerPackages=False

[URL]
Port=7777

[IpDrv.TcpNetDriver]
; Server frames per second (UT2004: 20 on the internet, 35 on a LAN)
NetServerMaxTickRate=30

[IpDrv.MasterServerUplink]
; Register with the OldUnreal master servers (internet server browsers). Off unless you want it.
DoUplink=False

[Engine.GameReplicationInfo]
ServerName=OpenUT2k4 Server
ShortName=OpenUT2k4
AdminName=
AdminEmail=
MessageOfTheDay=
;MOTDLine1=
;MOTDLine2=
;MOTDLine3=
;MOTDLine4=

[Engine.AccessControl]
; AdminPassword also protects the TCP admin console below
AdminPassword=
GamePassword=
; Banned player ids, one per line: BannedIDs=<32 hex digit id> <name> (bans made with the admin "ban" command are
; kept in <state dir>/Bans.ini)

[Engine.GameInfo]
MaxPlayers=16
MaxSpectators=2
GameDifficulty=3

; Per game type settings (the stock defaults)
[XGame.xDeathMatch]
TimeLimit=20
GoalScore=25

[XGame.xTeamGame]
TimeLimit=20
GoalScore=60

[XGame.xCTFGame]
TimeLimit=20
GoalScore=3

[XGame.xDoubleDom]
TimeLimit=20
GoalScore=3

[XGame.xBombingRun]
TimeLimit=20
GoalScore=15

[Engine.GameEngine]
; ServerPackages (what clients must have): none listed here = the UT2004 install's own list (its System/UT2004.ini or
; Default.ini). ServerPackages= lines replace that list only with [OpenUT2k4.Server] UseServerPackages=True.
; ServerActors: the stock uplink (DoUplink above), LAN beacon and query actors are built in; UWeb.WebServer stands
; for the admin console below (no WebAdmin yet).

[OpenUT2k4.AdminConsole]
; Line based admin console over TCP (telnet / nc), protected by AdminPassword. Keep it on 127.0.0.1 unless you put it
; behind something that encrypts it: the password is sent in clear text.
bEnabled=False
ListenAddress=127.0.0.1
Port=7780

[OpenUT2k4.Paths]
; Empty: the game's defaults (the content cache in the user's data folder, the UT2004 install found like the game
; finds it). Relative paths are relative to this file.
ContentCache=
UT2004Dir=
UserContent=
