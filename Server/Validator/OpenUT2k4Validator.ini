; OpenUT2k4 Validator: settings for the server's ini (UT2004.ini on a stock server, the server ini of the OpenUT2k4
; dedicated server). Copy the section into that ini and change what you need. Every value below is the default:
; nothing changes for players until you change a policy. Server/Docs/Validator.md explains each key.
;
; Install on a stock UT2004 server (3369 or OldUnreal 3374): copy OpenUT2k4Validator.u and .int to System/ and add
;   [Engine.GameEngine]
;   ServerActors=OpenUT2k4Validator.OUTValidator
; (or start with ?Mutator=OpenUT2k4Validator.OUTValidator). The same ServerActors= line turns on the validator built
; into the OpenUT2k4 dedicated server (no .u needed there).

[OpenUT2k4Validator.OUTValidator]
; What happens per result: Allow (log only), Mark (log, and publish the result to every client), Kick.
; Identified = valid signature of the player's key; Failed = bad signature, wrong key, replayed or malformed answer;
; NoResponse = an OpenUT2k4 client that sent no answer (or has no key). Real UT2004 clients are never challenged.
IdentifiedPolicy=Mark
FailedPolicy=Mark
NoResponsePolicy=Mark
ResponseTimeout=30
; This server's address as players dial it (IP or host name, one line each). Behind NAT set it: answers signed for any
; other address then fail (relayed challenge). Unset, an address that is not the server's own is accepted when the
; port matches and logged as "address unverified".
;PublicAddress=203.0.113.10
;PublicAddress=ut.example.org
; replicate fingerprints to every client together with a marked result (off: they stay on the server)
bPublicFingerprints=False
; only whitelisted keys may play (OpenUT2k4 clients; real UT2004 clients are not affected)
bWhitelistOnly=False

; Probation for keys this server first saw less than ProbationHours ago (0: off).
; ProbationPolicy: Allow | Flag (log, admin list, marked) | Limited (Flag, and no map / kick voting) | Kick
ProbationHours=0
ProbationPolicy=Flag
; at most this many players on probation at once (0: no cap); more are kicked
MaxProbationPlayers=0

; Bans (System/OpenUT2k4ValidatorKeys.ini and the imported shared lists): a ban holds a key fingerprint, the IP the
; server saw, optionally a subnet (CIDR) and the UT2004 CD key id. A match on ANY of them applies BanPolicy.
; BanPolicy: Kick | Flag. Subnet matching is off by default (shared ISPs, carrier-grade NAT).
BanPolicy=Kick
bMatchBanIP=True
bMatchBanCIDR=False
bMatchBanLegacyId=True
; check every player's IP / UT2004 id against the bans, not only OpenUT2k4 clients
bApplyBansToAllClients=True

; Shared ban lists: issuers you trust, one line each: <64 hex digit Ed25519 public key> <name>
;TrustedBanIssuer=0123...cdef ExampleLeague
; OpenUT2k4 dedicated server only (the mutator relies on the import script, see Validator.md): lists to fetch
;BanListSource=https://example.org/bans.txt
;BanListSource=bans/friends.txt
BanListRefreshMinutes=60
; OpenUT2k4 dedicated server only: an Identified player's fingerprint becomes the player id for kick / ban
bUseKeyAsPlayerId=False

; Sanity checks (mutator): log only unless SanityPolicy=Kick
bSanityChecks=True
bSanityChecksAllClients=False
SanityPolicy=Log
SpeedHackRatio=1.25
MaxWalkSpeedFactor=1.6
SnapAngle=60
MaxNewNetPingDT=1.0

; Cost: rows of the RSA check per server tick (a check is 548 rows, about 12 ms of script time on a 3369 server)
VerifyRowsPerTick=64
bSelfTest=True
